<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구실 샘플 현황</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#5f6b7a;--line:#e1e5ea;--acc:#1f5fa8;--accbg:#e8f0fb;--ok:#2e7d4f;--okbg:#e5f4ea;--warn:#a35a00;--warnbg:#fdf0dc;--bad:#b3261e;--badbg:#fbe5e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1f24;--fg:#e6e9ed;--mut:#9aa5b1;--line:#2c323a;--acc:#7fb0ef;--accbg:#1d2a3b;--ok:#7fd19b;--okbg:#1c2e23;--warn:#f0b462;--warnbg:#33281a;--bad:#f28b82;--badbg:#3a1f1d}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1f24;--fg:#e6e9ed;--mut:#9aa5b1;--line:#2c323a;--acc:#7fb0ef;--accbg:#1d2a3b;--ok:#7fd19b;--okbg:#1c2e23;--warn:#f0b462;--warnbg:#33281a;--bad:#f28b82;--badbg:#3a1f1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{padding:16px;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:20px}
.meta{color:var(--mut);font-size:12px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--mut);font-size:12px}
.stat.alert b{color:var(--bad)}
main{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mut);padding:10px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tools input,.tools select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.tools input{flex:1 1 220px}
.count{color:var(--mut);font-size:12px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:var(--bg);position:sticky;top:0;cursor:pointer;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accbg)}
.id{font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
.s-보관{background:var(--okbg);color:var(--ok)}
.s-사용중,.s-반출{background:var(--warnbg);color:var(--warn)}
.s-파손,.s-소진,.s-폐기{background:var(--badbg);color:var(--bad)}
.noloc{color:var(--bad);font-size:12px}
.bar{display:flex;gap:2px}
.bar i{width:12px;height:8px;border-radius:2px;background:var(--line)}
.bar i.d{background:var(--acc)}
.cards{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .sub{color:var(--mut);font-size:13px;margin-top:2px}
@media (max-width:760px){.wide{display:none}.cards{display:block}}
dialog{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px}
.dh button{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
.db{padding:8px 16px 16px;max-height:70vh;overflow:auto}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;word-break:break-all}
a{color:var(--acc)}
.empty{padding:24px;text-align:center;color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>연구실 샘플 현황</h1>
  <div class="meta" id="meta"></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools" id="tools"></div>
  <p class="count" id="count"></p>
  <div id="view"></div>
  <p class="note">이 페이지는 읽기 전용입니다. 수정·반출 기록은 원본 엑셀에서 하고, 변환 스크립트로 페이지를 다시 만들어 주세요.</p>
</main>
<dialog id="dlg"><div class="dh"><h2 id="dt"></h2><button onclick="dlg.close();history.replaceState(null,'',location.pathname)" aria-label="닫기">×</button></div><div class="db" id="dbody"></div></dialog>

 locations:{name:'보관 위치',rows:L,key:'위치코드',filters:[],cols:[['위치코드',r=>`<span class="id">${esc(r['위치코드'])}</span>`],['캐비닛/장소'],['선반'],['박스'],['설명'],['보관 수',r=>[...S,...W].filter(x=>x['보관위치']===r['위치코드']).length]],
  card:r=>`<div class="top"><span class="id">${esc(r['위치코드'])}</span><span class="sub">${[...S,...W].filter(x=>x['보관위치']===r['위치코드']).length}개</span></div><div class="sub">${esc([r['캐비닛/장소'],r['선반'],r['박스'],r['설명']].filter(Boolean).join(' · '))}</div>`},
 log:{name:'반출 기록',rows:G.slice().reverse(),key:'샘플ID',filters:[],cols:Object.keys(G[0]||{'일시':1,'샘플ID':1,'구분(반출/반납/위치변경/파손)':1,'사용자':1,'목적(측정·실험명)':1}).map(k=>[k]),
  card:r=>`<div class="top"><span class="id">${esc(r['샘플ID'])}</span><span class="sub">${esc(r['일시'])}</span></div><div class="sub">${esc(Object.entries(r).filter(([k])=>!['샘플ID','일시'].includes(k)).map(([,v])=>v).filter(Boolean).join(' · '))}</div>`}
};
let cur='samples',q='',F={},sortK=null,sortD=1;
try{const t=localStorage.getItem('tab');if(TABS[t])cur=t}catch(e){}
function tabs(){$('tabs').innerHTML=Object.entries(TABS).map(([k,t])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${t.name} (${t.rows.length})</button>`).join('')}
function go(k){cur=k;q='';F={};sortK=null;try{localStorage.setItem('tab',k)}catch(e){}tabs();tools();render()}
function tools(){const t=TABS[cur];
 $('tools').innerHTML=`<input id="q" type="search" placeholder="검색 (ID, 품목명, 제조사, 위치, 비고…)" value="${esc(q)}">`+t.filters.map(f=>{const vs=[...new Set(t.rows.map(r=>r[f]).filter(Boolean))].sort();return `<select data-f="${esc(f)}"><option value="">${esc(f)} 전체</option>${vs.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`}).join('')+(cur==='samples'||cur==='specimens'?`<select data-f="__loc"><option value="">위치 전체</option><option value="__none">위치 미입력만</option>${[...new Set(t.rows.map(r=>r['보관위치']).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('')}</select>`:'');
 $('q').oninput=e=>{q=e.target.value;render()};
 document.querySelectorAll('#tools select').forEach(s=>s.onchange=e=>{F[s.dataset.f]=e.target.value;render()});}
function filtered(){const t=TABS[cur],ql=q.trim().toLowerCase();
 let rs=t.rows.filter(r=>(!ql||Object.values(r).join(' ').toLowerCase().includes(ql))&&Object.entries(F).every(([k,v])=>!v||(k==='__loc'?(v==='__none'?!r['보관위치']:r['보관위치']===v):r[k]===v)));
 if(sortK)rs=rs.slice().sort((a,b)=>String(a[sortK]||'').localeCompare(String(b[sortK]||''),'ko',{numeric:true})*sortD);return rs}
function render(){const t=TABS[cur],rs=filtered();
 $('count').textContent=`${rs.length}건`;
 if(!rs.length){$('view').innerHTML='<div class="empty">조건에 맞는 항목이 없습니다.</div>';return}
 $('view').innerHTML=`<div class="wide"><table><thead><tr>${t.cols.map(([h])=>`<th data-k="${esc(h)}">${esc(h)}${sortK===h?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rs.map((r,i)=>`<tr data-i="${i}">${t.cols.map(([h,fn])=>`<td>${fn?fn(r):esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="cards">${rs.map((r,i)=>`<div class="card" data-i="${i}">${t.card(r)}</div>`).join('')}</div>`;
 document.querySelectorAll('#view th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;render()});
 document.querySelectorAll('#view [data-i]').forEach(el=>el.onclick=()=>show(rs[+el.dataset.i]));}
function show(r){const t=TABS[cur];$('dt').textContent=(r[t.key]||'')+(r['품목명']?'  '+r['품목명']:'');
 let h='<dl class="kv">'+Object.entries(r).filter(([k,v])=>v!==''&&!k.startsWith('_')).map(([k,v])=>{let val=esc(v);if(k==='데이터시트'&&r._link)val=`<a href="${esc(r._link)}" target="_blank" rel="noopener">${esc(v==='링크'?'열기':v)}</a>`;else if(/^https?:/.test(v))val=`<a href="${esc(v)}" target="_blank" rel="noopener">열기</a>`;else if(k==='진행률')val=esc(v)+'%';return `<dt>${esc(k)}</dt><dd>${val}</dd>`}).join('')+'</dl>';
 const id=r['샘플ID']||r['시편ID'];
 if(id){const kids=W.filter(w=>w['모샘플ID']===id);if(kids.length)h+=`<p><b>파생 시편</b>: ${kids.map(k=>esc(k['시편ID'])).join(', ')}</p>`;
  const lg=G.filter(g=>g['샘플ID']===id);if(lg.length)h+=`<p><b>반출 기록</b></p><ul>${lg.map(g=>`<li>${esc(Object.values(g).filter(Boolean).join(' · '))}</li>`).join('')}</ul>`;
  if(cur!=='log')history.replaceState(null,'','#'+encodeURIComponent(id));}
 $('dbody').innerHTML=h;$('dlg').showModal()}
function fromHash(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;
 for(const k of ['samples','specimens']){const r=TABS[k].rows.find(x=>x[TABS[k].key]===id);if(r){go(k);show(r);return}}}
tabs();tools();render();fromHash();
</script>
</body>
</html>
